<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1116">
<title>E01 · CONCEPTOS BÁSICOS SOBRE ORGANIZACIONES Y ADMINISTRACIÓN</title>
<style>
:root{
  --ink:#0e1116; --panel:#161b24; --panel-2:#1d2430; --line:#2a3342;
  --paper:#12161d;
  --fg:#eef1f6; --muted:#98a4b5; --soft:#c3ccd9;
  --gold:#c9a24a; --gold-2:#e2c477; --gold-dim:#8a7433;
  --focus:#e2c477;
  --serif:"Georgia","Times New Roman",serif;
  --sans:"Segoe UI",system-ui,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{font-size:20px;scroll-behavior:smooth}
body{
  margin:0; color:var(--fg); background:var(--ink);
  font-family:var(--sans); line-height:1.75; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1200px 600px at 85% -10%, rgba(201,162,74,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(80,120,180,.08), transparent 60%);
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1500px;margin:0 auto;padding:3.5vh 5vw 6vh}

/* reading progress bar */
#progress{position:fixed;top:0;left:0;height:4px;width:0;
  background:linear-gradient(90deg,var(--gold),var(--gold-2));z-index:50;
  box-shadow:0 0 12px rgba(226,196,119,.6);transition:width .08s linear}

/* monogram */
.brand{display:flex;align-items:center;gap:1.1rem}
.mono{width:64px;height:64px;flex:none;border-radius:14px;
  background:linear-gradient(145deg,#20283400,#151b24);
  border:1.5px solid var(--gold-dim);position:relative;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.mono span{font-family:var(--serif);font-weight:700;font-size:1.9rem;
  letter-spacing:1px;background:linear-gradient(180deg,var(--gold-2),var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* header */
header.site{padding:2vh 0 3.2vh;margin-bottom:3.5vh;border-bottom:1px solid var(--line)}
.eyebrow{font-size:.8rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--gold-2);font-weight:600;margin:0 0 .5rem}
header.site h1{font-family:var(--serif);font-weight:700;font-size:2.9rem;
  line-height:1.12;margin:.1rem 0 .3rem;letter-spacing:.3px}
header.site .sub{color:var(--muted);font-size:1.05rem;max-width:60ch}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);
  margin:1.4rem 0 0;width:220px}

/* chapter list */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:1.15rem;margin-top:1rem}
.item{display:flex;align-items:center;gap:1.3rem;
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px solid var(--line);border-left:3px solid transparent;
  border-radius:14px;padding:1.25rem 1.5rem;outline:none;
  transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease,background .14s ease}
.item .idx{font-family:var(--serif);font-size:1.6rem;font-weight:700;
  color:var(--gold-2);min-width:2.8rem;text-align:center;
  border-right:1px solid var(--line);padding-right:1.1rem;line-height:1}
.item .body{display:flex;flex-direction:column;gap:.2rem}
.item .code{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:600}
.item .title{font-size:1.18rem;font-weight:600;line-height:1.3;color:var(--fg)}
.item .go{margin-left:auto;color:var(--gold);font-size:1.4rem;opacity:.5;transition:opacity .14s,transform .14s}
.item:hover,.item:focus,.item:focus-visible{
  border-color:var(--line);border-left-color:var(--gold);
  background:linear-gradient(180deg,#1b2330,#222b3a);
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 0 3px rgba(226,196,119,.28)}
.item:hover .go,.item:focus .go{opacity:1;transform:translateX(4px)}

/* reader */
.reader{max-width:860px;margin:0 auto}
.crumbs{display:flex;align-items:center;gap:.8rem;color:var(--muted);
  font-size:.82rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;margin-bottom:1.1rem}
.crumbs .chip{background:var(--panel-2);border:1px solid var(--line);
  color:var(--gold-2);border-radius:999px;padding:.28rem .8rem;letter-spacing:.12em}
.reader h1{font-family:var(--serif);font-weight:700;font-size:2.5rem;
  line-height:1.18;margin:.2rem 0 1rem;letter-spacing:.2px}
.reader .rule{width:160px;margin-bottom:2rem}
.reader p{font-size:1.24rem;margin:0 0 1.2rem;color:var(--soft);text-align:justify;hyphens:auto}
.reader p.lead{font-size:1.34rem;color:#fff;font-weight:500;text-align:left}
.content:empty{min-height:40vh}
.reader p.lead::first-letter{font-family:var(--serif);float:left;font-size:4.2rem;
  line-height:.82;padding:.12em .14em 0 0;color:var(--gold-2);font-weight:700}

/* audio player */
.player{background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.3rem;margin:0 0 2.4rem;
  box-shadow:0 8px 26px rgba(0,0,0,.35)}
.player .plabel{display:flex;align-items:center;gap:.6rem;color:var(--gold-2);
  font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;font-weight:600;margin-bottom:.7rem}
.player audio{width:100%;height:44px}

/* nav buttons */
.nav{display:flex;gap:1rem;flex-wrap:wrap;align-items:stretch}
.nav.top{margin-bottom:2.2rem}
.nav.bottom{margin:3rem 0 1rem;border-top:1px solid var(--line);padding-top:2rem}
.btn{display:inline-flex;align-items:center;gap:.6rem;
  background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
  padding:.85rem 1.4rem;font-size:1.02rem;font-weight:600;color:var(--soft);
  cursor:pointer;outline:none;transition:all .14s ease}
.btn small{display:block;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:.1rem}
.btn.grow{flex:1;min-width:200px}
.btn.next{text-align:right;justify-content:flex-end}
.btn:hover,.btn:focus,.btn:focus-visible{
  border-color:var(--gold);color:#fff;background:#222b3a;
  box-shadow:0 0 0 3px rgba(226,196,119,.3)}
.btn.primary{background:linear-gradient(180deg,var(--gold-2),var(--gold));
  color:#1a140a;border-color:var(--gold)}
.btn.primary small{color:#5c4a20}
.btn.primary:hover,.btn.primary:focus{color:#0f0b04;box-shadow:0 0 0 3px rgba(226,196,119,.45)}

footer{color:var(--muted);text-align:center;padding:5vh 0 2vh;font-size:.9rem;
  border-top:1px solid var(--line);margin-top:4vh;letter-spacing:.04em}
footer .dot{color:var(--gold);margin:0 .5rem}

@media (max-width:820px){
  html{font-size:17px}
  header.site h1{font-size:2.1rem}
  .reader h1{font-size:1.9rem}
  .list{grid-template-columns:1fr}
  .reader p{text-align:left}
}
@media (min-width:1600px){ html{font-size:22px} }
</style>
</head>
<body>
<div id="progress"></div>
<div class="wrap">

<div class="reader">
  <div class="nav top">
    <a class="btn" href="index.html" tabindex="0">&#9776; <span><small>Volver al</small>Índice</span></a>
  </div>
  <div class="crumbs"><span class="chip">E01</span> Capítulo 1 de 16</div>
  <h1>CONCEPTOS BÁSICOS SOBRE ORGANIZACIONES Y ADMINISTRACIÓN</h1>
  <div class="rule"></div>
  <div class="player"><div class="plabel">&#9835; Audio del capítulo</div><audio controls preload="none" src="01.mp3"></audio></div>
  <div id="content" class="content" aria-live="polite">
    <noscript><p>Este capítulo se carga desde <a href="01.txt">01.txt</a>. Activá JavaScript para leerlo aquí.</p></noscript>
  </div>
  <div class="nav bottom"><a class="btn" href="index.html" tabindex="0">&#9776; <span><small>Ver</small>Índice</span></a><a class="btn grow next primary" id="next" href="cap-E02.html" tabindex="0"><span><small>Siguiente</small>E02</span> &#9654;</a></div>
</div>
<footer>Administración Gerencial<span class="dot">&bull;</span>&#9664; &#9654; cambian de capítulo<span class="dot">&bull;</span>Atrás vuelve al índice</footer>

</div>
<script>
document.addEventListener('DOMContentLoaded',function(){
  var prev=document.getElementById('prev'), next=document.getElementById('next'), bar=document.getElementById('progress');
  (document.querySelector('.btn')||document.body).focus();
  function upd(){var h=document.documentElement;var sc=h.scrollTop||document.body.scrollTop;
    var mx=(h.scrollHeight-h.clientHeight)||1;bar.style.width=Math.min(100,sc/mx*100)+'%';}
  window.addEventListener('scroll',upd,{passive:true});upd();
  fetch('01.txt',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
    .then(function(t){
      var box=document.getElementById('content');box.textContent='';
      t.replace(/^\uFEFF/,'').split(/\r?\n\s*\r?\n/).forEach(function(par,i){
        par=par.replace(/\s*\r?\n\s*/g,' ').trim(); if(!par)return;
        var p=document.createElement('p'); if(i===0)p.className='lead'; p.textContent=par; box.appendChild(p);
      });
      upd();
    })
    .catch(function(){
      var box=document.getElementById('content');box.textContent='';
      var p=document.createElement('p');p.innerHTML='No se pudo cargar el texto del capítulo. <a href="01.txt">Abrir 01.txt</a>';box.appendChild(p);
    });
  document.addEventListener('keydown',function(e){
    if(e.target&&e.target.tagName==='AUDIO')return;
    if(e.key==='ArrowLeft'&&prev){prev.click();}
    if(e.key==='ArrowRight'&&next){next.click();}
    if(e.key==='Backspace'||e.key==='Escape'){window.location.href='index.html';}
    if(e.key==='PageDown'||e.key===' '){e.preventDefault();window.scrollBy(0,window.innerHeight*0.85);}
    if(e.key==='PageUp'){e.preventDefault();window.scrollBy(0,-window.innerHeight*0.85);}
  });
});
</script>
</body>
</html>
